name: Set up build
description: Installs JDK 21, the Android SDK platform-tools package and Gradle. Run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # local.properties is gitignored, so the SDK has to be installed here.
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The action defaults to `tools platform-tools`, but the legacy `tools`
        # package no longer exists in the SDK repository and the install fails
        # with "Failed to find package 'tools'".
        packages: platform-tools

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
