# Keep each job under 3.5 minutes. A job that grows past that moves to
# instrumented.yml-style triggers: on demand, nightly, and on master.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A test-only PR may add or extend tests and nothing else. See scope-check.sh.
  scope:
    name: Scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The scope check diffs against the base branch, so it needs the full history.
          fetch-depth: 0

      # A PR is test-only when its head branch starts with test/ or its author is listed
      # in the TEST_ONLY_AUTHORS repository variable (comma-separated logins).
      - name: Decide if the PR is test-only
        id: decide
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TEST_ONLY_AUTHORS: ${{ vars.TEST_ONLY_AUTHORS }}
        run: |
          is_test_only=false
          case "$HEAD_REF" in
            test/*) is_test_only=true ;;
          esac
          author="$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"
          listed="$(printf '%s' "$TEST_ONLY_AUTHORS" | tr '[:upper:]' '[:lower:]')"
          IFS=',' read -ra logins <<< "$listed"
          for login in "${logins[@]}"; do
            login="${login//[[:space:]]/}"
            if [ -n "$login" ] && [ "$login" = "$author" ]; then
              is_test_only=true
            fi
          done
          echo "is_test_only=$is_test_only" >> "$GITHUB_OUTPUT"
          echo "Test-only PR: $is_test_only"

      - name: Scope check
        env:
          BASE_REF: origin/${{ github.base_ref }}
          IS_TEST_ONLY: ${{ steps.decide.outputs.is_test_only }}
        run: bash .github/scripts/scope-check.sh "$BASE_REF" "$IS_TEST_ONLY"

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build
        uses: ./.github/actions/setup

      - name: ktlint
        run: ./gradlew ktlintCheck

      # Runs even when ktlint fails, so the detekt report is always written.
      - name: detekt
        if: always()
        run: ./gradlew detekt

      # always() so reports survive a failing step above.
      # Detekt writes into whichever build dir its plugin is applied to.
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: |
            build/reports/detekt/**
            app/build/reports/detekt/**
          if-no-files-found: ignore

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build
        uses: ./.github/actions/setup

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # always() so reports survive a failing step above.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build
        uses: ./.github/actions/setup

      - name: Android lint
        run: ./gradlew lint

      # always() so reports survive a failing step above.
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  assemble:
    name: Debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up build
        uses: ./.github/actions/setup

      - name: Assemble debug
        run: ./gradlew assembleDebug

      # always() so the APK upload runs even when the build fails.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
