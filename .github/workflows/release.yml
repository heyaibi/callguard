name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fail before building so a tag on a repo without signing secrets cannot
      # publish an unsigned APK as a release.
      - name: Check signing secret
        env:
          KEYSTORE_BASE64: ${{ secrets.CALLGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CALLGUARD_KEYSTORE_BASE64 is not set. Add the signing secrets before tagging a release."
            exit 1
          fi

      # Passed through env rather than interpolated, so the secret never lands in the shell command line.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CALLGUARD_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/callguard-release.jks"

      - name: Assemble release
        env:
          CALLGUARD_KEYSTORE: ${{ runner.temp }}/callguard-release.jks
          CALLGUARD_KEYSTORE_PASSWORD: ${{ secrets.CALLGUARD_KEYSTORE_PASSWORD }}
          CALLGUARD_KEY_ALIAS: ${{ secrets.CALLGUARD_KEY_ALIAS }}
          CALLGUARD_KEY_PASSWORD: ${{ secrets.CALLGUARD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false

      - name: Remove decoded keystore
        if: always()
        run: rm -f $RUNNER_TEMP/callguard-release.jks
